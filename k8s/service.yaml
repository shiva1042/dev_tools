# =============================================================================
# Kubernetes Service for Dev Tools Suite
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: dev-tools
  namespace: dev-tools
  labels:
    app.kubernetes.io/name: dev-tools
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dev-tools
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
