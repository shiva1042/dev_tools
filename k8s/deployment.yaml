# =============================================================================
# Kubernetes Deployment for Dev Tools Suite
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-tools
  namespace: dev-tools
  labels:
    app.kubernetes.io/name: dev-tools
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: dev-tools-suite
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-tools
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-tools
        app.kubernetes.io/component: frontend
    spec:
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      containers:
        - name: dev-tools
          # Image will be replaced by CI/CD pipeline
          image: dev-tools:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: dev-tools-config

          # Resource limits and requests
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # Liveness probe - is the container alive?
          livenessProbe:
            httpGet:
              path: /dev-tools/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe - is the container ready to serve traffic?
          readinessProbe:
            httpGet:
              path: /dev-tools/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Startup probe - give the container time to start
          startupProbe:
            httpGet:
              path: /dev-tools/
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          # Security context for the container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

      # Pod anti-affinity to spread across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: dev-tools
                topologyKey: kubernetes.io/hostname

      # Graceful termination
      terminationGracePeriodSeconds: 30
